# Fixed configuration behind the recorded reference trajectory.
#
# Every module runs on its dummy backend, so the run is arithmetic in Python
# and reproduces to the last bit on a given machine. What it exercises is the
# coupling framework: the main loop, the timestep controller, the helpfile
# round-trip and the handshakes between modules.
#
# Settings that steer the run are written out here rather than left to a
# schema default, so that changing a default is a change to the code under
# test rather than a silent change to the fixture. Everything that sets a step
# size is pinned for that reason, and that is not only [params.dt]: the
# interior clamps the step against its own temperature tolerances, and those
# are pinned beside the module that applies them.
#
# The pinning is not exhaustive and cannot be. A field this file does not
# name takes its schema default, and changing that default moves the
# trajectory with the configuration's bytes unchanged, so the comparison
# reports it as a difference rather than as a configuration mismatch. That is
# the intended reading: the default is part of the behaviour under test.
#
# Changing this file changes the trajectory, so the reference has to be
# recorded again in the same commit. Running the golden-run test with
# --record-golden does that, and the comparison refuses a reference recorded
# against different text.
config_version = "3.0"

[params]
    [params.out]
        path        = "auto"
        logging     = "WARNING"
        # No plots and no archives: both are output-side work that costs far
        # more than the run itself and cannot influence the trajectory.
        plot_mod    = "none"
        archive_mod = "none"
        # Every iteration reaches the helpfile, so the reference covers each
        # step rather than a subsample of them.
        write_mod    = 1
        dt_write_rel = 0.0

    # The step controller decides every step size, so all of it is pinned.
    [params.dt]
        method      = "adaptive"
        propconst   = 52.0
        atol        = 0.02
        rtol        = 0.10
        scale_incr  = 1.6
        scale_decr  = 0.8
        window      = 3
        initial     = 1e2        # initial step [yr]
        minimum     = 1e2        # min step [yr]
        minimum_rel = 1e-5
        maximum     = 3e7        # max step [yr]
        maximum_rel = 1.0
        # How often the star is recomputed. The dummy star holds a fixed
        # luminosity, so neither changes anything here; pinned so that they
        # keep not changing anything.
        starspec    = 1e8        # [yr]
        starinst    = 1e2        # [yr]
        # Stiffness-aware extensions, off. They exist for solvers that stall
        # in the mushy zone, which the dummy interior does not.
        mushy_maximum     = 0.0
        mushy_upper       = 0.99
        hysteresis_iters  = 0
        hysteresis_sfinc  = 1.1
        max_growth_factor = 0.0

    [params.stop]
        [params.stop.iters]
            enabled = true
            minimum = 1
            # The iteration cap is what ends the run. A run ended on
            # simulation time has its final step clamped against the time
            # remaining, which makes the last row depend on where the stop
            # time happened to fall. Ending on the cap keeps every step under
            # the control of the timestep controller alone. 55 iterations
            # carry the mantle from fully molten through complete
            # solidification with several steps to spare.
            maximum = 55
        [params.stop.time]
            enabled = true
            minimum = 0.0
            maximum = 1e9
        [params.stop.solid]
            # Solidification must not end the run: the iteration cap is the
            # single termination criterion, and stopping at the solidus would
            # cut the trajectory short of the solid regime.
            enabled          = false
            phi_crit         = 0.01
            freeze_volatiles = false
        [params.stop.escape]
            enabled = false
        [params.stop.radeqm]
            enabled = false

[star]
    module = "dummy"
    [star.dummy]
        radius = 1.0             # [R_sun]

[orbit]
    module        = "dummy"
    semimajoraxis = 0.5          # [AU]
    eccentricity  = 0.1
    [orbit.dummy]
        # Both are inert here: the interior takes no tidal heating (see
        # interior_energetics.heat_tidal below), so the orbit module computes
        # these and nothing consumes them. They are pinned so that switching
        # the heating on later starts from a stated tidal power rather than
        # from whatever the schema defaults to at the time.
        H_tide = 1e-9            # tidal power density [W/kg]
        Imk2   = -0.01           # Im(k2) love number

[planet]
    mass_tot         = 1.0       # [M_earth]
    # The initial condition the whole trajectory hangs from, well above the
    # liquidus so the run starts wholly molten.
    tsurf_init       = 4000.0    # [K]
    # adiabatic_from_cmb keeps the all-dummy path free of the silicate
    # liquidus lookup, so this config runs without any external solver.
    temperature_mode = "adiabatic_from_cmb"
    volatile_mode    = "elements"
    [planet.elements]
        O_mode   = "ic_chemistry"
        O_budget = 0.0
        H_mode   = "ppmw"
        H_budget = 1e4
        C_mode   = "ppmw"
        C_budget = 1e3
        N_mode   = "ppmw"
        N_budget = 500
        S_mode   = "ppmw"
        S_budget = 500

[interior_struct]
    module         = "dummy"
    core_frac      = 0.55        # radius fraction
    core_frac_mode = "radius"

[interior_energetics]
    module = "dummy"
    # No heat reaches the interior from any source, which is what makes the
    # magma ocean cool monotonically over the whole run. The tests assert that
    # monotonicity, so these are pinned here rather than left to defaults that
    # could be flipped without the assertion changing meaning. The radiogenic
    # channel is left switched on and fed a rate of zero, which is how the
    # module is normally run.
    heat_tidal      = false
    heat_radiogenic = true
    # The other half of the step-size control. The module caps its own step so
    # that the magma-ocean temperature moves by no more than these per step,
    # so they set the discretisation exactly as [params.dt] does.
    tmagma_atol     = 20.0       # [K]
    tmagma_rtol     = 0.02
    [interior_energetics.dummy]
        heat_internal = 0.0      # radiogenic heating rate [W/kg]
        mantle_tliq = 2700.0
        mantle_tsol = 1700.0
        # Low against the melt heat capacities used elsewhere, which is what
        # lets the mantle cross its whole melting interval inside the
        # iteration cap. Cooling faster does not simplify the trajectory: the
        # timestep controller shortens the step to follow it.
        mantle_cp   = 500.0

[outgas]
    fO2_shift_IW = 2
    module       = "dummy"

[atmos_clim]
    module = "dummy"
    # Not "skin", which solves for the surface temperature with a secant
    # iteration to a tolerance of 1e-7. That tolerance would sit in the
    # trajectory, and a change to the interior is amplified on its way into
    # the volatile partitioning, so a different iteration count on another
    # platform would show up as a difference this comparison resolves. With
    # "fixed" the whole run is straight-line arithmetic and the only platform
    # dependence left is the last bit of the maths library.
    surf_state = "fixed"
    rayleigh   = false
    albedo_pl  = 0.1
    [atmos_clim.dummy]
        gamma = 0.5              # T_rad = T_surf * (1 - gamma)
        # Sets the observed radius through the atmospheric scale height, and
        # so several of the columns this run records.
        height_factor = 3.0

[escape]
    module    = "dummy"
    reservoir = "outgas"
    [escape.dummy]
        # Escape is on, unlike the wiring configuration this is derived from.
        # Solidification alone already moves the volatile columns here, by
        # degassing the mantle as it freezes, so escape is not what makes them
        # move; measured on this configuration it takes the count of moving
        # columns from 82 to 104 out of 459. What it adds that nothing else
        # does is the escape path itself: with no escape the elemental totals,
        # the per-element rates, the cumulative escaped mass and the planet
        # mass are all constants, and a constant can catch a change that
        # disturbs it but can never tell two trajectories apart.
        rate = 1e5               # bulk mass loss rate [kg s-1]

[atmos_chem]
    module = "dummy"
    when   = "offline"
