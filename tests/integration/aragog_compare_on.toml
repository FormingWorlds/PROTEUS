# Configuration for Aragog compare run (solid-state rheology enabled)
config_version = "3.0"

    [params.out]
        path = "auto"
        plot_mod = 0
        write_mod = 0

    [params.dt]
        initial  = 1e2           # initial step [yr]
        minimum  = 1e2           # min step [yr]
        maximum  = 1e3           # max step [yr]

    [params.stop.time]
        minimum  = 0.0
        maximum  = 1e2           # stop time [yr]
    [params.stop.iters]
        enabled  = true
        minimum  = 0
        maximum  = 1
    [params.stop.solid]
        enabled = false
    [params.stop.escape]
        enabled = false
    [params.stop.radeqm]
        enabled = false

# Star: fixed solar luminosity
[star]
    module = "dummy"
    [star.dummy]
        radius = 1.0

# Orbit: 0.5 AU
[orbit]
    module        = "dummy"
    semimajoraxis = 0.5
    eccentricity  = 0.1
    [orbit.dummy]
        H_tide = 1e-9
        Imk2   = -0.01

# Planet: 1 Earth mass
[planet]
    mass_tot         = 1.0
    temperature_mode = "adiabatic_from_cmb"
    volatile_mode    = "elements"
    [planet.elements]
        O_mode   = "ic_chemistry"
        O_budget = 0.0
        H_mode   = "ppmw"
        H_budget = 1e4
        C_mode   = "ppmw"
        C_budget = 1e3
        N_mode   = "ppmw"
        N_budget = 500
        S_mode   = "ppmw"
        S_budget = 500

# Interior structure: dummy scaling
[interior_struct]
    module         = "dummy"
    core_frac      = 0.55
    core_frac_mode = "radius"
    melting_dir    = "Monteux-600"

# Interior energetics: Aragog
[interior_energetics]
    module                 = "aragog"
    grain_size             = 1e-3
    write_flux_diagnostics = true
    [interior_energetics.aragog]
        backend              = "jax"
        enabled              = true
        arrhenius_t_ref      = 1600.0
        yield_stress_max     = 500.0e6
        viscosity_max_log10  = 40.0
        lid_base_mode        = "fixed"
        lid_base_temperature = 1400.0
        lid_contrast_coeff   = 2.2
        activation_energy    = 300.0e3
        activation_volume    = 5.0e-6
        yield_stress_c       = 50.0e6
        yield_stress_mu      = 0.6
        stress_closure_mode  = "local"

# Outgassing: dummy
[outgas]
    fO2_shift_IW = 2
    module       = "dummy"

# Atmosphere: dummy
[atmos_clim]
    module     = "dummy"
    surf_state = "fixed"
    rayleigh   = false
    albedo_pl  = 0.1
    [atmos_clim.dummy]
        gamma = 0.5

# Escape: dummy
[escape]
    module = "dummy"
    [escape.dummy]
        rate = 0.0

[atmos_chem]
    module = "dummy"
    when   = "offline"
