# Deviations of the Linux install job from docs/How-to/installation.md. A `match`
# that is not on the page fails the job; a command with no entry runs as written.

[[substitution]]
match = "sudo apt install gfortran libnetcdff-dev build-essential curl wget git cmake unzip"
replace = "sudo apt-get update && sudo apt-get install -y gfortran libnetcdff-dev build-essential curl wget git cmake unzip"
reason = "A runner has no terminal to confirm the install."

[[substitution]]
match = "bash ~/miniconda3/miniconda.sh"
replace = "bash ~/miniconda3/miniconda.sh -b -u -p ~/miniconda3 && ~/miniconda3/bin/conda init bash && source ~/miniconda3/etc/profile.d/conda.sh"
reason = "The installer is interactive and a runner has no terminal; conda is made available to this shell session, which stands for the new terminal of the page."

[[substitution]]
match = "git clone git@github.com:FormingWorlds/PROTEUS.git"
replace = 'git clone "$GITHUB_WORKSPACE" PROTEUS'
reason = "The job tests the pushed commit, not the default branch."

[[substitution]]
match = "wget https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh -O ~/miniconda3/miniconda.sh"
replace = "wget https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh -O ~/miniconda3/miniconda.sh"
reason = "This job installs conda through Miniforge; the folder and the later commands stay as on the page."
