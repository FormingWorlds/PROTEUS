# Deviations of the Linux install job from docs/How-to/installation.md. A `match`
# that is not on the page fails the job; a command with no entry runs as written.

[[substitution]]
match = "sudo apt install gfortran libnetcdff-dev build-essential curl wget git cmake unzip"
replace = "sudo apt-get update && sudo apt-get install -y gfortran libnetcdff-dev build-essential curl wget git cmake unzip"
reason = "A runner has no terminal to confirm the install."

[[substitution]]
match = "bash ~/miniconda3/miniconda.sh"
replace = "bash ~/miniconda3/miniconda.sh -b -u -p ~/miniconda3 && ~/miniconda3/bin/conda init bash && source ~/miniconda3/etc/profile.d/conda.sh"
reason = "The Miniconda installer is interactive and a runner has no terminal; conda is made available to this shell session."

[[substitution]]
match = "git clone https://github.com/FormingWorlds/PROTEUS.git"
replace = 'git clone "$GITHUB_WORKSPACE" PROTEUS'
reason = "The job tests the pushed commit, not the default branch."

# The Anaconda default channels (Miniconda from repo.anaconda.com) require a
# terms-of-service acceptance before `conda create` in a non-interactive shell.
[[substitution]]
match = "conda create -n proteus python=3.12"
replace = "conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/main && conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/r && conda create -y -n proteus python=3.12"
reason = "A runner has no terminal to confirm, and the Anaconda default channels need their terms of service accepted (conda tos accept) before conda create."

# Ubuntu's ~/.bashrc returns at the top in a non-interactive shell, so the lines
# that install.sh and the juliaup installer append to it are evaluated directly.
[[substitution]]
match = "source ~/.bashrc"
replace = '''eval "$(sed -n -e '/^# >>> juliaup initialize >>>/,/^# <<< juliaup initialize <<</p' -e '/^export FWL_DATA=/p' -e '/^export RAD_DIR=/p' -e '/^export FC_DIR=/p' -e '/^export PYTHON_JULIAPKG_EXE=/p' ~/.bashrc)"'''
reason = "install.sh appends the FWL_DATA, RAD_DIR, FC_DIR and PYTHON_JULIAPKG_EXE exports and the juliaup PATH block to ~/.bashrc, and Ubuntu's ~/.bashrc returns early in a non-interactive shell, so a plain source loads nothing; the job evaluates those lines directly."
