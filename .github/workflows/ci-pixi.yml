# Installs PROTEUS into the pixi environment from pixi.toml and runs the unit tier.
name: Pixi environment

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pixi-unit:
    name: Unit tests in the pixi environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.6'

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.79.0
          cache: false

      - name: Check the prebuilt CVODE wrapper imports
        run: pixi run python -c "import scikits_odes_sundials.cvode"

      - name: Install PROTEUS into the pixi environment
        run: pixi run pip install -e ".[develop]"

      # test_janus.py needs a SOCRATES build and the netcdf pre-flight test needs nc-config on the host; this job provides neither.
      - name: Run unit tests
        run: >-
          pixi run pytest -m "unit and not skip and not slow and not integration"
          --ignore=tests/examples --ignore=tests/atmos_clim/test_janus.py
          --deselect tests/test_installer.py::TestPreflightChecks::test_netcdf_fortran_required_even_when_c_interface_present
