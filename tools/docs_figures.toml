page = "chili_intercomparison.md"
asset = "docs/assets/tutorials/chili/fig2_milestones"
runs = [
    "chili_earth",
    "chili_grid_earth_Hlow_Clow",
    "chili_grid_earth_Hlow_Cmid",
    "chili_grid_earth_Hlow_Chigh",
    "chili_grid_earth_Hmid_Clow",
    "chili_grid_earth_Hmid_Cmid",
    "chili_grid_earth_Hmid_Chigh",
    "chili_grid_earth_Hhigh_Clow",
    "chili_grid_earth_Hhigh_Cmid",
    "chili_grid_earth_Hhigh_Chigh",
]
maker = "tools/plot_chili_comparison.py:make_figure"
args = { fig_id = "chili_fig2_milestones", chili_repo = "{chili_repo}", earth = "{runs}/chili_earth", grid_dir = "{runs}" }

