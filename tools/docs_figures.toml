# Figures of the tutorial pages. `python tools/make_docs_figures.py --runs <folder>` draws
# each entry as `<asset>.avif` (light) and `<asset>_dark.avif` (dark) with proteus-mpl.
# How to add a figure: docs/How-to/documentation.md, "Update the tutorial figures".

# Lowest version of proteus-mpl that the tool accepts; equal to the floor in pyproject.toml.
proteus_mpl = "1.5.0"
avif_quality = 80
pages = "docs/Tutorials"
# Pages whose figures do not come from this tool; `--check` names and skips them.
exempt_pages = []

# Run of input/dummy.toml; PROTEUS names its folder after the start time: give it with --run.
[[figure]]
id = "dummy_global_lin"
page = "quick_start_dummy.md"
asset = "docs/assets/tutorials/dummy_global_lin"
runs = ["quick_start"]
maker = "proteus:global"
args = { logt = false, tmin = 1e3 }

# Run of input/tutorials/tutorial_earth.toml.
[[figure]]
id = "earth_global_log"
page = "earth_analogue.md"
asset = "docs/assets/tutorials/earth_global_log"
runs = ["tutorial_earth"]
maker = "proteus:global"
args = { logt = true, tmin = 1e3 }

# Grid of input/tutorials/tutorial_grid.toml (`proteus grid`).
[[figure]]
id = "grid_tracks"
page = "parameter_grid.md"
asset = "docs/assets/tutorials/grid/grid_tracks"
runs = ["tutorial_grid"]
maker = "tools/plot_grid_tutorial.py:make_tracks"

# Grid of input/tutorials/tutorial_grid.toml (`proteus grid`).
[[figure]]
id = "grid_outputs"
page = "parameter_grid.md"
asset = "docs/assets/tutorials/grid/grid_outputs"
runs = ["tutorial_grid"]
maker = "tools/plot_grid_tutorial.py:make_outputs"

# Run of input/tutorials/tutorial_earth_moon.toml, which ends at 8e5 yr.
[[figure]]
id = "orbit_tides_orbit"
page = "orbit_tides.md"
asset = "docs/assets/orbit/orbit_tides_orbit"
runs = ["tutorial_earth_moon"]
maker = "proteus:orbit"

# Run of input/tutorials/tutorial_earth_moon.toml, which ends at 8e5 yr.
