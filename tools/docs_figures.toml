# Runs of input/chili/intercomp/earth.toml and input/chili/intercomp/venus.toml.
[[figure]]
id = "chili_fig1_melt_fraction"
page = "chili_intercomparison.md"
asset = "docs/assets/tutorials/chili/fig1_melt_fraction"
runs = ["chili_earth", "chili_venus"]
maker = "tools/plot_chili_comparison.py:make_figure"
args = { fig_id = "chili_fig1_melt_fraction", chili_repo = "{chili_repo}", earth = "{runs}/chili_earth", venus = "{runs}/chili_venus" }

# Run of input/chili/intercomp/earth.toml and of the 9 configs in input/tutorials/chili_grid/.
