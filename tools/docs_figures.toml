# Figures of the tutorial pages. `python tools/make_docs_figures.py --runs <folder>` draws
# each entry as `<asset>.avif` (light) and `<asset>_dark.avif` (dark) with proteus-mpl.
# How to add a figure: docs/How-to/documentation.md, "Update the tutorial figures".

# Lowest version of proteus-mpl that the tool accepts; equal to the floor in pyproject.toml.
proteus_mpl = "1.3.0"
avif_quality = 80
pages = "docs/Tutorials"
# Pages whose figures do not come from this tool; `--check` names and skips them.
exempt_pages = ["chili_intercomparison.md"]

# The quick start run (input/dummy.toml); PROTEUS names its folder after the start time.
[[figure]]
id = "dummy_global_lin"
page = "quick_start_dummy.md"
asset = "docs/assets/tutorials/dummy_global_lin"
runs = ["run_20261012_175211_ae08"]
maker = "proteus:global"
args = { logt = false, tmin = 1e3 }

[[figure]]
id = "earth_global_log"
page = "earth_analogue.md"
asset = "docs/assets/tutorials/earth_global_log"
runs = ["tutorial_earth"]
maker = "proteus:global"
args = { logt = true, tmin = 1e3 }

[[figure]]
id = "grid_tracks"
page = "parameter_grid.md"
asset = "docs/assets/tutorials/grid/grid_tracks"
runs = ["tutorial_grid"]
