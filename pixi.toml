[workspace]
name = "proteus"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = "3.12.*"
pip = "*"
# Julia 1.12 ships OpenSSL_jll 3.5+; juliacall matches it to Python's OpenSSL.
openssl = ">=3.5"
# SUNDIALS backs Aragog's CVODE solver via scikits-odes-sundials.
sundials = ">=7,<8"
