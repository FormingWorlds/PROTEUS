# Tutorial: volatiles trapped in the freezing mantle, node by node (docs/Tutorials/layer_trapping.md).
# The Earth analogue of input/tutorials/tutorial_earth.toml at 1.5 AU, under a grey (dummy)
# atmosphere so that a run takes minutes, with 4e18 kg of N and outgas.trap_mode = "layers".

config_version = "3.0"

[params.out]
    path    = "tutorial_layer_trapping"
    logging = "INFO"

[params.dt]
    method        = "adaptive"
    initial       = 10.0
    minimum       = 100.0
    maximum       = 1e7
    starspec      = 1e9
    atol          = 0.04
    rtol          = 0.11
    mushy_maximum = 4e3
    mushy_upper   = 0.99

    [params.stop.time]
        maximum = 5e9
    [params.stop.solid]
        phi_crit = 0.05

[star]
    module  = "mors"
    mass    = 1.0
    age_ini = 0.05
    [star.mors]
        tracks          = "spada"
        age_now         = 4.567
        rot_pcntle      = 50.0
        star_name       = "sun"
        spectrum_source = "solar"

[orbit]
    module        = "none"
    semimajoraxis = 1.5
    eccentricity  = 0.0
    zenith_angle  = 48.19
    s0_factor     = 0.375

[planet]
    mass_tot         = 1.0
    prevent_warming  = false
    temperature_mode = "liquidus_super"
    delta_T_super    = 500.0
    volatile_mode    = "elements"
    [planet.elements]
        O_mode   = "ic_chemistry"
        O_budget = 0.0
        H_mode   = "kg"
        H_budget = 4.7e20
        C_mode   = "kg"
        C_budget = 2.73e20
        N_mode   = "kg"
        N_budget = 4.0e18
        S_mode   = "kg"
        S_budget = 0.0

[interior_struct]
    module         = "zalmoxis"
    core_frac      = 0.325
    core_frac_mode = "mass"

    [interior_struct.zalmoxis]
        core_eos          = "PALEOS:iron"
        mantle_eos        = "PALEOS-2phase:MgSiO3"
        mushy_zone_factor = 0.8
        num_levels        = 150
        dry_mantle        = true
        use_jax           = true
        update_interval   = 0.0

[interior_energetics]
    module           = "aragog"
    num_levels       = 80
    rtol             = 1e-8
    flux_guess       = 1000.0
    trans_conduction = true
    trans_convection = true
    trans_grav_sep   = true
    trans_mixing     = true
    heat_radiogenic  = true
    radio_tref       = 4.55
    radio_K          = 310.0
    radio_U          = 0.031
    radio_Th         = 0.124
    grain_size       = 1e-3
    mixing_length    = "constant"

    [interior_energetics.aragog]
        mass_coordinates = true
        core_bc          = "energy_balance"
        phase_smoothing  = "tanh"
        solver_method    = "cvode"
        backend          = "jax"

[outgas]
    module       = "calliope"
    fO2_shift_IW = 4.0
    trap_mode       = "layers"
    [outgas.calliope]
        include_H2O = true
        include_CO2 = true
        include_N2  = true
        include_S2  = true
        include_H2  = true
        include_CH4 = true
        include_CO  = true
        solubility  = true

[atmos_clim]
    module   = "dummy"
    rayleigh = false
    [atmos_clim.dummy]
        gamma = 0.8

[escape]
    module = "zephyrus"
    [escape.zephyrus]
        efficiency = 0.3
