# PROTEUS configuration file for TOI-561 b.
# Includes a orbit.parameterized migration track

config_version = "3.0"

[atmos_chem]
Kzz_const = "none"
Kzz_on = true
module = "vulcan"
moldiff_on = true
photo_on = true
updraft_const = 0.0
when = "offline"

[atmos_chem.vulcan]
clip_fl = 1e-20
clip_vmr = 1e-10
fix_surf = false
ini_mix = "profile"
make_funs = true
network = "SNCHO"
save_frames = true
slope_cri = 0.0001
yconv_cri = 0.05

[atmos_clim]
albedo_pl = 0.0  # enforced Bond albedo; do not combine with rayleigh = true
cloud_alpha = 0.0
cloud_enabled = false
module = "agni"
rayleigh = false
surf_greyalbedo = 0.1
surf_state = "fixed"
surface_d = 0.01
surface_k = 2.0
tmp_minimum = 0.5
p_top = 1e-06

[atmos_clim.agni]
chemistry = "none"
conduction = true
convection = true
dx_max = 35.0
dx_max_ini = 300.0
fastchem_floor = 150.0
fastchem_maxiter_chem = 60000
fastchem_maxiter_solv = 20000
fastchem_xtol_chem = 0.0001
fastchem_xtol_elem = 0.0001
fdo = 2
ini_profile = "isothermal"
latent_heat = true
ls_default = 2
max_steps = 70
mlt_criterion = "s"
oceans = true
perturb_all = true
psurf_thresh = 0.1
rainout = true
real_gas = true
sens_heat = true
solution_atol = 0.01
solution_rtol = 0.05
solve_energy = true
surf_material = "greybody"
surf_roughness = 0.001
surf_windspeed = 2.0
verbosity = 1

[atmos_clim.janus]
tmp_maximum = 5000.0

[planet]
prevent_warming = true
volatile_mode = "elements"
mass_tot = 2.24  # [M_earth] Brinkman et al. 2023
temperature_mode = "isentropic"
ini_entropy = 4000.0
ini_dsdr = -4.698e-06

[planet.elements]
metallicity = 1000
use_metallicity = false
H_mode = "oceans"
H_budget = 100.0  # [Earth oceans]
C_mode = "C/H"
C_budget = 0.1
N_mode = "ppmw"
N_budget = 20.1
S_mode = "S/H"
S_budget = 10
O_mode = "ic_chemistry"
O_budget = 0.0

[planet.gas_prs]
CH4 = 0.0
CO = 0.0
CO2 = 0.0
H2 = 0.0
H2O = 0.0
H2S = 0.0
N2 = 0.0
NH3 = 0.0
S2 = 0.0
SO2 = 0.0

[accretion]
module = "none"

[interior_energetics]
radio_K = 310.0
radio_Th = 0.124
radio_U = 0.031
radio_tref = 4.55
flux_guess = 100000.0
grain_size = 0.1
module = "spider"
heat_radiogenic = true
rfront_loc = 0.4
rfront_wid = 0.15
trans_conduction = true
trans_convection = true
trans_grav_sep = true
trans_mixing = true
mixing_length = "constant"
num_levels = 60
atol = 1e-10
rtol = 1e-08
tmagma_atol = 20.0
tmagma_rtol = 0.01
heat_tidal = false
kappah_floor = 0.0
tmagma_tides_step = 4.0

[interior_energetics.spider]
matprop_smooth_width = 0.01
solver_type = "bdf"

[escape]
module = "zephyrus"
reservoir = "outgas"
hill_clamp = false

[escape.zephyrus]
Pxuv = 0.01
efficiency = 0.001
tidal = false

[interior_struct]
eos_dir = "WolfBower2018_MgSiO3"
melting_dir = "Monteux-600"
core_density = 10738.33
core_heatcap = 880.0
core_frac = 0.35  # radius fraction, Brinkman et al. 2023
module = "spider"
core_frac_mode = "radius"

[orbit]
axial_period = "none"
star_planet_model = "parameterized"
eccentricity = 0.0  # Brinkman et al. 2023
instellation_method = "distance"
instellationflux = 1.0
module = "none"
s0_factor = 0.375
semimajoraxis = 0.0106  # [AU] Patel et al. 2023
zenith_angle = 48.19

[orbit.dummy]
H_tide = 1e-11
Imk2 = 0.0
Phi_tide = "<0.3"

[orbit.lovepy]
visc_thresh = 1000000000.0

[orbit.parameterized]
migration = "high_ecc"
sma_init = 0.029
sma_final = 0.0106
time_migration = 1e6
tau_migration = 1e7

[outgas]
T_floor = 700.0
solver_rtol = 0.0001
solver_atol = 1e-06
fO2_shift_IW = 4  # [dex] relative to the iron-wustite buffer
module = "calliope"

[outgas.calliope]
include_CH4 = true
include_CO = true
include_CO2 = true
include_H2 = true
include_H2O = true
include_H2S = true
include_N2 = true
include_NH3 = true
include_S2 = true
include_SO2 = true
solubility = true

[params.dt]
atol = 0.02
rtol = 0.1
initial = 1000.0
maximum = 500000000.0
method = "adaptive"
minimum = 50000.0
minimum_rel = 1e-05
propconst = 52.0
starinst = 100.0
starspec = 1000000.0
maximum_rel = 0.0

[params.out]
archive_mod = 30
logging = "INFO"
path = "scratch/toi561b"
plot_fmt = "pdf"
plot_mod = 20
remove_sf = true
write_mod = 20

[params.stop]
strict = false

[params.stop.disint]
enabled = false
offset_roche = 0
offset_spin = 0
roche_enabled = false
spin_enabled = false

[params.stop.escape]
enabled = false
p_stop = 1.0

[params.stop.iters]
enabled = false
maximum = 5000000.0
minimum = 5

[params.stop.radeqm]
atol = 0.1
enabled = false
rtol = 0.001

[params.stop.solid]
enabled = false
phi_crit = 0.005

[params.stop.time]
enabled = true
maximum = 11000000000.0
minimum = 1000.0

[star]
age_ini = 0.1
mass = 0.806  # [M_sun] Lacedelli et al. 2022
module = "mors"
bol_scale_start = 0.0
bol_scale_duration = 100.0

# star_path overrides both star_name and spectrum_source, so those two are inert.
[star.mors]
age_now = 11  # [Gyr] Lacedelli et al. 2022
phoenix_FeH = 0.0
phoenix_Teff = "none"
phoenix_alpha = 0.0
phoenix_log_g = "none"
phoenix_radius = "none"
rot_pcntle = 50.0
rot_period = "none"
spectrum_source = "solar"
star_name = "sun"
star_path = "$FWL_DATA/stellar_spectra/Named/toi561.txt"
tracks = "spada"
