# PROTEUS quick example: the interior, structure, outgassing and star modules of minimal.toml with a grey atmosphere
# in place of AGNI. Run: proteus start -c input/minimal_quick.toml (about 12 min on a workstation).
# For an install check in under 1 min use input/dummy.toml, which replaces every module by its dummy.

# Config file format version
config_version = "3.0"

[params]
    [params.dt]
        minimum = 100.0              # [yr]
    [params.stop.solid]
        phi_crit = 0.05              # melt fraction at which the mantle counts as solidified

[orbit]
    semimajoraxis = 1.0              # [AU]

[planet]
    mass_tot      = 1.0              # [M_earth]
    volatile_mode = "elements"
    [planet.elements]
        O_mode   = "ic_chemistry"  # ic_chemistry | ppmw | kg | FeO_mantle_wt_pct
        O_budget = 0.0           # ignored for ic_chemistry mode
        H_mode   = "oceans"
        H_budget = 3.0               # [Earth oceans]; close to the hydrogen mass of the Earth tutorial
        C_mode   = "kg"
        C_budget = 2.73e20           # [kg of carbon]

[interior_struct.zalmoxis]
    update_interval = 0.0            # [yr]; 0 keeps the structure of the initial state

[atmos_clim]
    module   = "dummy"
    rayleigh = false
    [atmos_clim.dummy]
        gamma = 0.8              # grey opacity, T_rad = T_surf * (1 - gamma); chosen for this case (default 0.5)

[outgas]
    module       = "calliope"        # explicit pin so the file is robust to schema-default changes
    fO2_shift_IW = 2                 # offset from IW [log10 units]
