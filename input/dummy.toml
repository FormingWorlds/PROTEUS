# PROTEUS: all-dummy configuration
# Every module set to "dummy" for fast test runs without external solvers
# (no AGNI, SPIDER, VULCAN, MORS, Zalmoxis, CALLIOPE, or SOCRATES needed).
# Use this for wiring tests, CI, and rapid development iteration.
# Config file format version
config_version = "3.0"

    [params.out]
        path = "auto"

    [params.dt]
        initial  = 1e2           # initial step [yr]
        minimum  = 1e2           # min step [yr]
        maximum  = 3e7           # max step [yr]

        [params.stop.time]
            maximum = 1e9        # stop time [yr]
        [params.stop.solid]
            enabled = true
        [params.stop.escape]
            enabled = false
        [params.stop.radeqm]
            enabled = false

# Star: fixed solar luminosity (no evolution)
[star]
    module = "dummy"
    [star.dummy]
        radius = 1.0                 # [R_sun]

# Orbit: 0.5 AU with weak tidal heating
[orbit]
    module        = "dummy"
    semimajoraxis = 0.5          # [AU]
    eccentricity  = 0.1
    [orbit.dummy]
        H_tide = 1e-9            # tidal power density [W/kg]
        Imk2   = -0.01           # Im(k2) love number

[planet]
    mass_tot         = 1.0
    prevent_warming  = false
    temperature_mode = "liquidus_super"
    delta_T_super    = 500.0
    volatile_mode    = "elements"
    fO2_source       = "from_mantle_redox"
    ferric_fraction_initial = 0.005


    [planet.elements]
        O_mode   = "ic_chemistry"
        O_budget = 0.0
        H_mode   = "kg"
        H_budget = 4.7e20
        C_mode   = "kg"
        C_budget = 2.73e20
        N_mode   = "kg"
        N_budget = 0.0
        S_mode   = "kg"
        S_budget = 0.0

[interior_struct]
    module         = "dummy"
    core_frac      = 0.325
    core_frac_mode = "mass"


[interior_energetics]
    module           = "aragog"
    num_levels       = 80
    rtol             = 1e-8
    flux_guess       = 1000.0
    trans_conduction = true
    trans_convection = true
    trans_grav_sep   = true
    trans_mixing     = true
    heat_radiogenic  = true
    radio_tref       = 4.55
    radio_K          = 310.0
    radio_U          = 0.031
    radio_Th         = 0.124
    grain_size       = 1e-3
    mixing_length    = "constant"

    [interior_energetics.aragog]
        mass_coordinates = true
        core_bc          = "energy_balance"
        phase_smoothing  = "tanh"
        solver_method    = "cvode"
        backend          = "jax"

[outgas]
    module       = "calliope"
    fO2_shift_IW = 4.0
    [outgas.calliope]
        include_H2O = true
        include_CO2 = true
        include_N2  = true
        include_S2  = true
        include_H2  = true
        include_CH4 = true
        include_CO  = true
        solubility  = true


# Atmosphere: grey opacity model
[atmos_clim]
    module     = "dummy"
    surf_state = "fixed"
    rayleigh   = false
    albedo_pl  = 0.1
    [atmos_clim.dummy]
        gamma = 0.5              # T_rad = T_surf * (1 - gamma); 0 = transparent, 1 = zero OLR

# Escape: fixed bulk rate
[escape]
    module = "dummy"
    [escape.dummy]
        rate = 0.0               # no escape, so the run reaches solidification

[atmos_chem]
    module = "dummy"
    when   = "offline"
