# Datasets consumed by PROTEUS itself, fetched through fwl-io.
#
# One TOML table per dataset. The dotted table key is the dataset location
# below FWL_DATA, so [observe.mass_radius.zeng_2019] resolves into
# observe/mass_radius/zeng_2019 and the location cannot drift from the key.
# Each dataset has a committed registry file next to this manifest, named
# <dotted-key>.registry.txt, generated by:  fwl-io sync <this file>
#
# Data consumed by several models of the ecosystem belongs in the manifest
# fwl-io ships, not here; this file is for data only PROTEUS reads. Datasets
# the downloader in utils/data.py provisions are absent from this file.

[observe.exoplanet_reference]
name = "DACE PlanetS catalogue of confirmed exoplanets"
zenodo = "10.5281/zenodo.15727878"
required_by = ["proteus"]

