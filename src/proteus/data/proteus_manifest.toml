# Datasets only PROTEUS reads, fetched through fwl-io; shared data is in the fwl-io manifest.
# Each dotted key is the dataset location below FWL_DATA, and its registry
# <dotted-key>.registry.txt next to this file comes from `fwl-io sync <this file>`.

