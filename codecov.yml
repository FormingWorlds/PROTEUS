coverage:
  # Badge colour gradient: red at 70%, bright green at 90%.
  # Matches the PROTEUS ecosystem 90% coverage ceiling.
  range: "70...90"
  status:
    project:
      default:
        target: auto
        flags: [unit-tests]
      nightly:
        target: auto
        flags: [nightly]
        # A commit without its own nightly upload carries a stale value forward; pass it.
        flag_coverage_not_uploaded_behavior: pass
    patch:
      default:
        target: 80%
flags:
  unit-tests:
    paths:
      - src/
    carryforward: true
  nightly:
    paths:
      - src/
    carryforward: true
